# On a `v*` tag: builds the CLI for Linux and macOS and attaches the archives to the release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release
      - name: Package
        run: |
          mkdir -p out
          cp target/release/vcwl README.md LICENSE out/
          tar czf vcwl-${{ matrix.target }}.tar.gz -C out .
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" vcwl-${{ matrix.target }}.tar.gz --clobber
