[package]
name = "vcwl"
version = "0.1.0"
edition = "2024"
description = "VCWL, the Vibe Coded Web Language: a statically typed language that compiles web apps to WebAssembly"
license = "MIT"
repository = "https://github.com/chteau/vcwl"
homepage = "https://vcwl.chteau.bzh/"

[workspace]
members = ["render"]

[dependencies]
vcwl-render = { path = "render" }
wasm-encoder = "0.262.0"
wasmparser = "0.262.0"
wasmtime = { version = "50.0.0", default-features = false, features = ["runtime", "cranelift", "gc", "gc-drc", "std", "anyhow"] }
