<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Vibbles, the VCWL mascot: a lime blob wearing sunglasses">
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d4ff9e"/>
      <stop offset="0.55" stop-color="#b6ff6c"/>
      <stop offset="1" stop-color="#7fd34a"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#b6ff6c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b6ff6c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="#111111" stroke="#2b2b2b" stroke-width="4"/>
  <circle cx="128" cy="140" r="104" fill="url(#glow)"/>
  <!-- the blob, leaning back like it owns the place -->
  <g transform="rotate(-6 128 140)">
    <path d="M128 46c46 0 78 26 82 72 4 44-10 82-40 96-12 6-20 2-26 12-4 7-10 10-16 10s-12-3-16-10c-6-10-14-6-26-12-30-14-44-52-40-96 4-46 36-72 82-72z" fill="url(#blob)"/>
    <!-- drip -->
    <path d="M150 214c0 0 10 14 10 22a10 10 0 0 1-20 0c0-8 10-22 10-22z" fill="#9be65a"/>
    <!-- shine -->
    <ellipse cx="92" cy="80" rx="18" ry="9" transform="rotate(-25 92 80)" fill="#ffffff" opacity="0.45"/>
    <!-- sunglasses -->
    <path d="M56 116h144" stroke="#0d0d0d" stroke-width="8" stroke-linecap="round"/>
    <path d="M62 114h56c0 22-8 36-28 36s-28-14-28-36z" fill="url(#lens)"/>
    <path d="M138 114h56c0 22-8 36-28 36s-28-14-28-36z" fill="url(#lens)"/>
    <path d="M72 122l12-6M148 122l12-6" stroke="#7cc4ff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <!-- smirk -->
    <path d="M104 172c14 10 34 10 50-4" fill="none" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/>
    <path d="M154 168l6-6" stroke="#0d0d0d" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
